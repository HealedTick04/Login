<main>
      <!--AL AGREGAR EL INDEX.HTML O HOME-->
  <form #loginForm="ngForm" (submit)="onLogin($event, loginForm)">
    <div>
      <h2>Iniciar Sesión</h2>
    </div>
    <div>
      <!--AL CREAR LOGEAR AL INDEX CON ngModel-->
      <label for="email">Correo Electrónico:</label>
      <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" ngModel required>
    </div>

    <div>
      <label for="password">Contraseña:</label>
      <input type="password" id="password" name="password" placeholder="********" ngModel required>
    </div>

    <button type="submit">Iniciar Sesión</button>

    <div class="register-link">
      <!--<p>¿No tienes cuenta? <a href="#">Registrate</a></p>-->
      <!--AL HACER REGISTRO.HTML-->
      <p>¿No tienes cuenta? <a routerLink="/registro">Registrate</a></p>
    </div>
  </form>
</main>
