<main>
  <!--AL HACER LOCALSTORAGE DEL LOGIN PARA INDEX-->
  <form #registroForm="ngForm" (submit)="onRegister($event, registroForm)">
    <div>
      <h2>Crear Cuenta</h2>
    </div>

    <div>
        <!--AL HACER LOCALSTORAGE DEL LOGIN PARA INDEX ngModel-->
      <label for="nombre">Nombre Completo:</label>
      <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" ngModel required>
    </div>

    <div>
      <label for="email">Correo Electrónico:</label>
      <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" ngModel required>
    </div>

    <div>
      <label for="password">Contraseña:</label>
      <input type="password" id="password" name="password" placeholder="********" ngModel required>
    </div>

    <button type="submit">Registrar</button>

    <div class="login-link">
      <!--<p>¿Ya tienes cuenta? <a href="#">Iniciar Sesión</a></p>
      esto ya estaba antes del registro.html pero se cambia mejor por -->
      <p>¿Ya tienes cuenta? <a routerLink="/login">Iniciar Sesión</a></p>

    </div>
  </form>
</main>
